name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test npm wrapper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out npm wrapper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Set up Python for metadata tests
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Test package
        run: npm test

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Build alias package
        run: npm run build:alias

      - name: Verify alias npm package contents
        run: npm pack --dry-run
        working-directory: dist/hermesagent

      - name: Verify canonical npm command shims
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          package_tarball="$(npm pack --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input)[0].filename));')"
          npm install --ignore-scripts --prefix "$tmp_dir" "./$package_tarball"
          for command in hermes hermes-agent hermes-npm; do
            test -e "$tmp_dir/node_modules/.bin/$command" || test -e "$tmp_dir/node_modules/.bin/$command.cmd"
          done
          package_root="$tmp_dir/node_modules/hermes-agent"
          node "$package_root/bin/hermes-npm.js" methods --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const value=JSON.parse(input); if (value.recommendedForNpmUsers !== "npm-isolated") process.exit(1); });'
          node "$package_root/bin/hermes-npm.js" migrate upstream --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const value=JSON.parse(input); if (!value.npmManagedInstall || value.mode !== "one-way-upstream-handoff") process.exit(1); });'

      - name: Verify alias npm command shims
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$tmp_dir" ./dist/hermesagent
          for command in hermes hermes-agent hermes-npm hermesagent; do
            test -e "$tmp_dir/node_modules/.bin/$command" || test -e "$tmp_dir/node_modules/.bin/$command.cmd"
          done

      - name: Provision isolated runtime
        run: npm run postinstall

      - name: Verify isolated runtime and native update check
        run: npm run smoke
